name: trosky_auth
description: "Authentication and session handling for the TroSky apps."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  trosky_api:
    path: ../trosky_api
  trosky_core:
    path: ../trosky_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.15.1
  shared_preferences_platform_interface: ^2.4.2
