apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trosky-api
  namespace: trosky
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trosky-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping down right after a burst
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
