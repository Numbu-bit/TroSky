apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trosky-worker
  namespace: trosky
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trosky-worker
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
