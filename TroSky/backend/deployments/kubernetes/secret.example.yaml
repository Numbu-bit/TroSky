# EXAMPLE ONLY — every value below is a placeholder, not a real secret.
# This file is committed so the *shape* of the required Secret is
# documented; it must never be applied as-is or contain real credentials.
#
# In practice, populate this via your cluster's secret manager integration
# (e.g. External Secrets Operator pulling from AWS Secrets Manager / GCP
# Secret Manager / Vault) rather than `kubectl apply -f` on a plain
# manifest — plaintext Secret objects are base64, not encrypted, and this
# file's job is only to enumerate every key the app actually needs.
apiVersion: v1
kind: Secret
metadata:
  name: trosky-backend-secrets
  namespace: trosky
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_A_REAL_32_PLUS_CHAR_SECRET"
  JWT_SECRET_KEY: "REPLACE_WITH_A_REAL_32_PLUS_CHAR_SECRET"
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/trosky"
  DATABASE_URL_SYNC: "postgresql+psycopg://USER:PASSWORD@HOST:5432/trosky"
  REDIS_URL: "redis://HOST:6379/0"
  CELERY_BROKER_URL: "redis://HOST:6379/1"
  CELERY_RESULT_BACKEND: "redis://HOST:6379/2"
  S3_ENDPOINT: "https://s3.eu-west-1.amazonaws.com"
  S3_BUCKET: "trosky-documents"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  PAYMENTS_WEBHOOK_SIGNING_SECRET: "REPLACE_WITH_A_REAL_32_PLUS_CHAR_SECRET"
  TICKET_QR_SIGNING_SECRET: "REPLACE_WITH_A_REAL_32_PLUS_CHAR_SECRET"
  PAYMENTS_MTN_MOMO_BASE_URL: "https://proxy.momoapi.mtn.com"
  PAYMENTS_MTN_MOMO_API_KEY: "REPLACE_ME"
  PAYMENTS_MTN_MOMO_API_SECRET: "REPLACE_ME"
  PAYMENTS_MTN_MOMO_SUBSCRIPTION_KEY: "REPLACE_ME"
  EMAIL_SMTP_PASSWORD: "REPLACE_WITH_THE_GMAIL_APP_PASSWORD" # 16 letters, no spaces
  SMS_API_KEY: "REPLACE_ME"
  SMS_API_SECRET: "REPLACE_ME"
  SMS_SENDER_ID: "TroSky"
  MAPS_API_KEY: "REPLACE_ME"
  FIREBASE_ENABLED: "false" # set true only once FIREBASE_CREDENTIALS_JSON below is populated
  FIREBASE_CREDENTIALS_JSON: ""
