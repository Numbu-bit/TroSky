apiVersion: apps/v1
kind: Deployment
metadata:
  name: trosky-worker
  namespace: trosky
  labels:
    app.kubernetes.io/name: trosky-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trosky-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trosky-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/trosky/backend:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.workers.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: trosky-backend-config
            - secretRef:
                name: trosky-backend-secrets
          env:
            - name: SERVICE_ROLE
              value: worker
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Celery has no built-in HTTP health endpoint; `celery inspect
          # ping` round-trips a real broker message, the honest signal
          # that this worker is actually consuming tasks, not just alive.
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.workers.celery_app
                - inspect
                - ping
                - --destination
                - "celery@$(HOSTNAME)"
                - --timeout
                - "5"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60 # let an in-flight task (e.g. a webhook handler) finish
