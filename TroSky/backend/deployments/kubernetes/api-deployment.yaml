apiVersion: apps/v1
kind: Deployment
metadata:
  name: trosky-api
  namespace: trosky
  labels:
    app.kubernetes.io/name: trosky-api
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below `replicas` capacity mid-rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: trosky-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trosky-api
        app.kubernetes.io/component: api
    spec:
      # DB schema migrations run via the dedicated Job (migration-job.yaml)
      # as an explicit pre-deploy step, never implicitly on pod startup —
      # three API replicas racing `alembic upgrade head` concurrently on
      # every rollout is exactly the kind of footgun a separate,
      # once-per-release Job avoids.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/trosky/backend:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: trosky-backend-config
            - secretRef:
                name: trosky-backend-secrets
          env:
            - name: SERVICE_ROLE
              value: api
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 45 # >= Gunicorn's --graceful-timeout in the Dockerfile
