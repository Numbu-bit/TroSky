[project]
name = "trosky-backend"
version = "0.1.0"
description = "TroSky: Smart Public Transport Platform for Ghana - Backend API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TroSky Engineering" }]

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "gunicorn>=23.0.0,<24.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pydantic-extra-types>=2.10.0,<3.0.0",
    # 2.1 is untested here (and changes the typing of result rows).
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "alembic>=1.13.3,<2.0.0",
    "geoalchemy2>=0.18.0,<0.21.0",
    "shapely>=2.0.6,<3.0.0",
    "redis[hiredis]>=5.1.1,<6.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "httpx>=0.27.2,<0.28.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "pyjwt[crypto]>=2.9.0,<3.0.0",
    "cryptography>=43.0.0,<44.0.0",
    "qrcode[pil]>=8.0,<9.0",
    "pyotp>=2.9.0,<3.0.0",
    "boto3>=1.35.0,<2.0.0",
    "firebase-admin>=6.5.0,<7.0.0",
    "structlog>=24.4.0,<25.0.0",
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
    "python-multipart>=0.0.12,<0.1.0",
    "email-validator>=2.2.0,<3.0.0",
    "phonenumbers>=8.13.45,<9.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "orjson>=3.10.7,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "factory-boy>=3.3.1,<4.0.0",
    "faker>=30.3.0,<31.0.0",
    "fakeredis>=2.25.1,<3.0.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "ruff>=0.7.1,<0.8.0",
    "mypy>=1.13.0,<2.0.0",
    "pre-commit>=4.0.1,<5.0.0",
    "types-boto3>=1.0.2",
    "freezegun>=1.5.1,<2.0.0",
    "locust>=2.32.1,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Ruff's defaults cover ".venv"/"venv" but not the suffixed interpreter
# directories developers end up with locally, and CI lints the whole
# tree with `ruff check .`. Excluding them by pattern keeps that
# command usable from a working copy as well as from a clean checkout.
extend-exclude = ["alembic/versions", ".venv*", "venv*"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF",
    "ASYNC", "S", "A", "PIE", "PT", "RET", "TID",
]
ignore = [
    "S101",   # assert allowed in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S110", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions", "tests/load"]

[[tool.mypy.overrides]]
module = ["celery.*", "firebase_admin.*", "qrcode.*", "geoalchemy2.*", "pyotp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no inline types, so `@celery_app.task(...)` is always seen as
# an untyped decorator; relax that single check for task modules only.
module = ["app.workers.tasks.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring Postgres/Redis services",
    "security: security regression tests",
    "e2e: end-to-end critical path tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py", "*/alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
