name: Fare engine

# The reference fare, payout and commission engine in TroSky/fare-engine.
# Standard library only, so the tests need nothing but Python.
on:
  push:
    branches: [main]
    paths: ["TroSky/fare-engine/**", ".github/workflows/fare-engine.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["TroSky/fare-engine/**", ".github/workflows/fare-engine.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: TroSky/fare-engine

jobs:
  tests:
    name: Fare engine tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests and the 10,000-trip simulation
        run: python -m unittest discover -s tests -t . -v

      - name: Worked examples still run
        run: python examples.py > /dev/null
