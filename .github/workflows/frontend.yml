name: Frontend

# Lives at the repository root because GitHub only runs workflows from
# <repo>/.github/workflows. The backend's TroSky/.github/workflows/ci.yml is
# one level too deep and never runs (see TroSky/frontend/docs/backend-requests.md).

on:
  push:
    paths:
      - "TroSky/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "TroSky/frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.2"

defaults:
  run:
    working-directory: TroSky/frontend

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      # Melos is a dev dependency of the workspace root, so CI uses the
      # version pinned in pubspec.lock.
      - run: dart run melos analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart run melos test

  build-web:
    name: Build web (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [fleet_web]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: flutter build web
        working-directory: TroSky/frontend/apps/${{ matrix.app }}
        run: flutter build web --release --no-pub --dart-define-from-file=../../env/dev.example.json

  signing-config-check:
    name: Signing config check (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify Gradle release signing wiring
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=apps/mobile/android/app/build.gradle.kts

          echo "::group::Assertions"
          grep -q 'rootProject.file("key.properties")' "$gradle_file" || {
            echo "::error file=$gradle_file::expected key.properties to be loaded via rootProject.file(\"key.properties\")"
            exit 1
          }

          grep -q 'signingConfig = signingConfigs.findByName("release")' "$gradle_file" || {
            echo "::error file=$gradle_file::expected release buildType to use signingConfigs.findByName(\"release\")"
            exit 1
          }

          if grep -q 'signingConfigs.getByName("debug")' "$gradle_file"; then
            echo "::error file=$gradle_file::release must not fall back to the debug keystore (C1)"
            exit 1
          fi

          grep -q 'val storeApplicationId = "com.trosky.app"' "$gradle_file" || {
            echo "::error file=$gradle_file::expected storeApplicationId = \"com.trosky.app\""
            exit 1
          }

          grep -q 'val verifyReleaseSigningReady' "$gradle_file" || {
            echo "::error file=$gradle_file::expected verifyReleaseSigningReady task"
            exit 1
          }
          grep -q 'assembleRelease\|bundleRelease' "$gradle_file" || {
            echo "::error file=$gradle_file::expected assembleRelease / bundleRelease wiring"
            exit 1
          }
          echo "::endgroup::"

          echo "Signing wiring OK."

      - name: Verify key.properties is gitignored
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          gi=apps/mobile/android/.gitignore
          grep -q '^key.properties$' "$gi" || {
            echo "::error file=$gi::expected 'key.properties' line in android/.gitignore"
            exit 1
          }
          grep -qE '^\*\*/\*\.jks$' "$gi" || {
            echo "::error file=$gi::expected '**/*.jks' line in android/.gitignore"
            exit 1
          }

      - name: Verify key.properties is not committed
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch TroSky/frontend/apps/mobile/android/key.properties 2>/dev/null; then
            echo "::error::apps/mobile/android/key.properties is tracked; it must stay gitignored"
            exit 1
          fi
          if git ls-files TroSky/frontend/apps/mobile/android/ | grep -Ei '\.jks$|\.keystore$'; then
            echo "::error::a .jks/.keystore file is tracked under android/; it must stay gitignored"
            exit 1
          fi
          echo "key.properties and keystore files are not tracked."

      - name: Verify signing runbook present
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/mobile/android/SIGNING.md || {
            echo "::error::apps/mobile/android/SIGNING.md is missing; C1 runbook required"
            exit 1
          }
          test -f apps/mobile/android/key.properties.example || {
            echo "::error::apps/mobile/android/key.properties.example is missing"
            exit 1
          }

  shrink-obfuscate-check:
    name: Shrink/obfuscate config check (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify R8 + resource shrinking wired on release
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=apps/mobile/android/app/build.gradle.kts

          grep -q 'isMinifyEnabled = true' "$gradle_file" || {
            echo "::error file=$gradle_file::expected isMinifyEnabled = true on release (C2)"
            exit 1
          }
          grep -q 'isShrinkResources = true' "$gradle_file" || {
            echo "::error file=$gradle_file::expected isShrinkResources = true on release (C2)"
            exit 1
          }
          grep -q 'proguardFiles(' "$gradle_file" || {
            echo "::error file=$gradle_file::expected proguardFiles(...) call on release (C2)"
            exit 1
          }
          grep -q 'proguard-android-optimize.txt' "$gradle_file" || {
            echo "::error file=$gradle_file::expected default proguard-android-optimize.txt (C2)"
            exit 1
          }
          grep -q '"proguard-rules.pro"' "$gradle_file" || {
            echo "::error file=$gradle_file::expected 'proguard-rules.pro' in proguardFiles (C2)"
            exit 1
          }

      - name: Verify ProGuard rules file present
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          rules=apps/mobile/android/app/proguard-rules.pro
          test -s "$rules" || {
            echo "::error::$rules missing or empty"
            exit 1
          }

      - name: Verify store-build entry point
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          script=apps/mobile/tool/build_store.sh
          test -x "$script" || {
            echo "::error::$script missing or not executable"
            exit 1
          }
          # Script must call --obfuscate and --split-debug-info to
          # produce de-identified Dart symbols.
          grep -q -- '--obfuscate' "$script" || {
            echo "::error::$script must pass --obfuscate"
            exit 1
          }
          grep -q -- '--split-debug-info=' "$script" || {
            echo "::error::$script must pass --split-debug-info"
            exit 1
          }
          # Prod env must not ship TESTER_MENU=true via this script.
          grep -q 'TESTER_MENU' "$script" || {
            echo "::error::$script must reject TESTER_MENU=true in prod"
            exit 1
          }
          # Script must preserve R8 mapping alongside Dart symbols.
          grep -q 'mapping.txt' "$script" || {
            echo "::error::$script must preserve mapping.txt"
            exit 1
          }
          bash -n "$script"

      - name: Verify obfuscation runbook present
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/mobile/android/OBFUSCATION.md || {
            echo "::error::apps/mobile/android/OBFUSCATION.md is missing; C2 runbook required"
            exit 1
          }

  backup-isolation-check:
    name: Backup isolation check (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify AndroidManifest declares allowBackup=false + rule XMLs
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          manifest=apps/mobile/android/app/src/main/AndroidManifest.xml

          grep -q 'android:allowBackup="false"' "$manifest" || {
            echo "::error file=$manifest::expected android:allowBackup=\"false\" (C3)"
            exit 1
          }
          grep -q 'android:fullBackupContent="@xml/backup_rules"' "$manifest" || {
            echo "::error file=$manifest::expected android:fullBackupContent=\"@xml/backup_rules\" (C3)"
            exit 1
          }
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$manifest" || {
            echo "::error file=$manifest::expected android:dataExtractionRules=\"@xml/data_extraction_rules\" (C3)"
            exit 1
          }

      - name: Verify rule XMLs exist and cover every domain
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          full=apps/mobile/android/app/src/main/res/xml/backup_rules.xml
          dxr=apps/mobile/android/app/src/main/res/xml/data_extraction_rules.xml
          test -s "$full" || { echo "::error::$full missing"; exit 1; }
          test -s "$dxr" || { echo "::error::$dxr missing"; exit 1; }

          for file in "$full" "$dxr"; do
            for d in root file database sharedpref external; do
              grep -q "domain=\"$d\"" "$file" || {
                echo "::error file=$file::missing <exclude domain=\"$d\" …>"
                exit 1
              }
            done
          done

          grep -q '<cloud-backup>' "$dxr" || {
            echo "::error file=$dxr::missing <cloud-backup> section"
            exit 1
          }
          grep -q '<device-transfer>' "$dxr" || {
            echo "::error file=$dxr::missing <device-transfer> section"
            exit 1
          }

      - name: Verify every FlutterSecureStorage call site uses troskySecureStorage
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE 'const\s+FlutterSecureStorage\s*\(\s*\)|[^.]FlutterSecureStorage\s*\(\s*\)' \
              apps/mobile/lib packages \
              --include='*.dart' \
              | grep -v 'secure_storage.dart'; then
            echo "::error::bare FlutterSecureStorage() construction found; use troskySecureStorage"
            exit 1
          fi

      - name: Verify iOS Keychain accessibility is set and is _this_device
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          factory=packages/trosky_auth/lib/src/secure_storage.dart
          test -s "$factory" || {
            echo "::error::$factory missing"
            exit 1
          }
          grep -q 'KeychainAccessibility.first_unlock_this_device' "$factory" || {
            echo "::error file=$factory::iOS accessibility must be first_unlock_this_device (C3)"
            exit 1
          }

      - name: Verify backup runbook present
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/mobile/android/BACKUP.md || {
            echo "::error::apps/mobile/android/BACKUP.md is missing; C3 runbook required"
            exit 1
          }

  prod-config-check:
    name: Prod config check (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify DeployEnv + prod invariants in Env.parse
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          env_dart=packages/trosky_core/lib/src/env.dart

          grep -q 'enum DeployEnv' "$env_dart" || {
            echo "::error file=$env_dart::expected enum DeployEnv (C4)"
            exit 1
          }
          for name in dev staging demo prod; do
            grep -q "DeployEnv.*$name\|  $name," "$env_dart" || {
              echo "::error file=$env_dart::expected DeployEnv.$name (C4)"
              exit 1
            }
          done
          grep -q '_placeholderApiHosts' "$env_dart" || {
            echo "::error file=$env_dart::expected _placeholderApiHosts set"
            exit 1
          }
          grep -q 'DEPLOY_ENV=prod requires API_MODE=live' "$env_dart" || {
            echo "::error file=$env_dart::expected prod invariant: API_MODE=live"
            exit 1
          }
          grep -q 'DEPLOY_ENV=prod requires an https:// API_BASE_URL' "$env_dart" || {
            echo "::error file=$env_dart::expected prod invariant: https API_BASE_URL"
            exit 1
          }
          grep -q 'DEPLOY_ENV=prod requires a wss:// WS_BASE_URL' "$env_dart" || {
            echo "::error file=$env_dart::expected prod invariant: wss WS_BASE_URL"
            exit 1
          }
          grep -q 'DEPLOY_ENV=prod forbids TESTER_MENU=true' "$env_dart" || {
            echo "::error file=$env_dart::expected prod invariant: TESTER_MENU forbidden"
            exit 1
          }
          grep -q 'testerMenuAllowed' "$env_dart" || {
            echo "::error file=$env_dart::expected env.testerMenuAllowed getter"
            exit 1
          }

      - name: Verify tester menu respects env.testerMenuAllowed
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          tester=apps/mobile/lib/app/tester/tester_menu.dart

          grep -q 'testerMenuLive' "$tester" || {
            echo "::error file=$tester::expected testerMenuLive helper"
            exit 1
          }
          grep -q 'env.testerMenuAllowed' "$tester" || {
            echo "::error file=$tester::expected runtime env.testerMenuAllowed check"
            exit 1
          }
          grep -q 'ConsumerStatefulWidget' "$tester" || {
            echo "::error file=$tester::TesterMenuTapCounter must watch env via Consumer*"
            exit 1
          }

      - name: Verify env templates declare DEPLOY_ENV
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          for f in env/dev.example.json env/staging.example.json env/prod.example.json; do
            test -f "$f" || { echo "::error::$f missing"; exit 1; }
            grep -q '"DEPLOY_ENV"' "$f" || {
              echo "::error file=$f::expected DEPLOY_ENV key"
              exit 1
            }
          done
          grep -q '"DEPLOY_ENV": "dev"' env/dev.example.json
          grep -q '"DEPLOY_ENV": "staging"' env/staging.example.json
          grep -q '"DEPLOY_ENV": "prod"' env/prod.example.json

      - name: Verify prod template has no TESTER_MENU=true
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '"TESTER_MENU"\s*:\s*"?true"?' env/prod.example.json; then
            echo "::error file=env/prod.example.json::prod must not enable TESTER_MENU"
            exit 1
          fi

  telemetry-schema-check:
    name: Telemetry schema check (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify telemetry schema in place
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          tf=apps/mobile/lib/app/telemetry.dart

          grep -q '_telemetrySchema' "$tf" || {
            echo "::error file=$tf::expected _telemetrySchema map (C5)"
            exit 1
          }
          grep -q 'Map<String, Object?>? get sanitised' "$tf" || {
            echo "::error file=$tf::sanitised must return nullable Map (C5)"
            exit 1
          }
          grep -q '_isSafeValue' "$tf" || {
            echo "::error file=$tf::expected _isSafeValue bounded-scalar check (C5)"
            exit 1
          }
          grep -q 'Map.unmodifiable(clean)' "$tf" || {
            echo "::error file=$tf::sanitised return must be unmodifiable (C5)"
            exit 1
          }
          grep -q "'trosky.telemetry.rejected'" "$tf" || {
            echo "::error file=$tf::debug diagnostics must emit under trosky.telemetry.rejected channel"
            exit 1
          }
          grep -q 'if (payload == null) return' "$tf" || {
            echo "::error file=$tf::ConsoleTelemetryService must drop null sanitised payloads (C5)"
            exit 1
          }

      - name: Verify every emitted event is in the schema
        working-directory: TroSky/frontend
        shell: bash
        run: |
          set -euo pipefail
          tf=apps/mobile/lib/app/telemetry.dart
          emitted=$(grep -rhE "TelemetryEvent\(['\"][a-z_]+['\"]" \
            apps/mobile/lib \
            --include='*.dart' \
            | grep -oE "TelemetryEvent\(['\"][a-z_]+['\"]" \
            | sed -E "s/TelemetryEvent\(['\"]([a-z_]+)['\"]/\1/" \
            | sort -u)
          missing=""
          for name in $emitted; do
            if ! grep -q "'$name':" "$tf"; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error file=$tf::emitted events missing from _telemetrySchema:$missing"
            exit 1
          fi

  build-apk:
    name: Build APK (mobile, debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: flutter build apk --debug
        working-directory: TroSky/frontend/apps/mobile
        run: |
          flutter build apk --debug --no-pub \
            --dart-define-from-file=../../env/dev.example.json \
            --dart-define=GIT_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD) \
            --dart-define=BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
