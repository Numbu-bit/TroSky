name: Frontend

# Lives at the repository root because GitHub only runs workflows from
# <repo>/.github/workflows. The backend's TroSky/.github/workflows/ci.yml is
# one level too deep and never runs (see TroSky/frontend/docs/backend-requests.md).

on:
  push:
    paths:
      - "TroSky/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "TroSky/frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.2"

defaults:
  run:
    working-directory: TroSky/frontend

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      # Melos is a dev dependency of the workspace root, so CI uses the
      # version pinned in pubspec.lock.
      - run: dart run melos analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart run melos test

  build-web:
    name: Build web (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin_web, fleet_web]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: flutter build web
        working-directory: TroSky/frontend/apps/${{ matrix.app }}
        run: flutter build web --release --no-pub --dart-define-from-file=../../env/dev.example.json

  build-apk:
    name: Build APK (mobile, debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: flutter build apk --debug
        working-directory: TroSky/frontend/apps/mobile
        run: flutter build apk --debug --no-pub --dart-define-from-file=../../env/dev.example.json
