name: Admin dashboard

# The React admin dashboard in TroSky/admin-dashboard (its README,
# "Continuous integration"). Lives at the repository root because GitHub only
# runs workflows from <repo>/.github/workflows.

on:
  push:
    paths:
      - "TroSky/admin-dashboard/**"
      - ".github/workflows/admin-dashboard.yml"
  pull_request:
    paths:
      - "TroSky/admin-dashboard/**"
      - ".github/workflows/admin-dashboard.yml"

concurrency:
  group: admin-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: TroSky/admin-dashboard

jobs:
  checks:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TroSky/admin-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Vitest with coverage; vite.config.ts fails the run below 80 % of lines.
      - run: npm run coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TroSky/admin-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # No demo data in the bundle, initial JavaScript within budget.
      - run: npm run check:build
      - name: A production build with demo mode on is refused
        run: |
          if VITE_DEMO_MODE=true npx vite build --outDir dist-refused --logLevel error; then
            echo "::error::vite build accepted VITE_DEMO_MODE=true outside demo mode"
            exit 1
          fi
          echo "Refused, as it should be."

  e2e:
    name: End-to-end (Playwright, demo build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TroSky/admin-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Builds and serves the demo (playwright.config.ts): every request is
      # answered in the browser, so no backend is needed.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: TroSky/admin-dashboard/playwright-report
          retention-days: 7

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t trosky-admin-dashboard:ci .
      - name: Start it
        run: |
          docker run -d --name dashboard -p 8080:8080 \
            -e API_ORIGIN=https://api.example.test trosky-admin-dashboard:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs dashboard
          exit 1
      - name: SPA fallback, source maps and security headers
        run: |
          fail() { echo "::error::$*"; exit 1; }
          curl -fsS http://127.0.0.1:8080/some/deep/link | grep -q 'id="root"' \
            || fail "a deep link doesn't fall back to index.html"
          map=$(docker exec dashboard sh -c 'ls /usr/share/nginx/html/assets/*.map 2>/dev/null | head -n 1')
          if [ -n "$map" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/assets/$(basename "$map")")
            [ "$code" = 404 ] || fail "source map served ($code)"
          fi
          headers=$(curl -fsSI http://127.0.0.1:8080/)
          echo "$headers"
          for expected in \
            "content-security-policy:.*connect-src 'self' https://api.example.test" \
            "content-security-policy:.*frame-ancestors 'none'" \
            "strict-transport-security: max-age=" \
            "x-frame-options: DENY" \
            "x-content-type-options: nosniff" \
            "referrer-policy: " \
            "permissions-policy: " \
            "cross-origin-opener-policy: same-origin"; do
            echo "$headers" | grep -qiE "^$expected" || fail "missing header: $expected"
          done
      - name: Container logs
        if: ${{ failure() }}
        run: docker logs dashboard
