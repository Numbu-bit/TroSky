name: Keep staging awake

# Supabase pauses a free project after 7 days without activity, and Render's
# free web service sleeps after 15 minutes. This workflow fires every 30
# minutes on the hour (:00 and :30) between 06:00 and 22:59 Africa/Accra
# (= UTC; Ghana is UTC+0); its sibling `keep-awake-b.yml` fires 15 minutes
# offset (:15 and :45), so the combined ping lands every 15 minutes while
# GitHub honours both schedules (the free tier skips many slots of a single
# `*/10` cron, which saw 3 runs in 23 h on 8 Nov). Each ping asks
# /health/ready, which runs "SELECT 1" on the database through the API, so
# the database sees a real query. No secrets needed.
# GitHub turns scheduled workflows off after 60 days without commits; then
# re-enable it under Actions, or run it by hand (workflow_dispatch).
# TroSky/backend/docs/deploy-render.md, "Database: Supabase".

on:
  schedule:
    - cron: "0,30 6-22 * * *" # every 30 min at :00 and :30, 06:00-22:30 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Wake the API and query the database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API: https://trosky-api.onrender.com
    steps:
      - name: Wake the API (a cold start takes about 30 s, sometimes minutes)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -m 60 -o /dev/null "$API/health/live"; then
              echo "awake after $i tries"
              exit 0
            fi
            echo "not awake yet ($i)"
            sleep 15
          done
          echo "::error::$API/health/live did not answer"
          exit 1
      - name: Query the database through /health/ready
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -m 60 -o ready.json -w '%{http_code}' "$API/health/ready" || true)
            echo "try $i: HTTP $code $(cat ready.json 2>/dev/null)"
            if [ "$code" = 200 ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::/health/ready never answered 200: the database or Redis is not reachable"
          exit 1
