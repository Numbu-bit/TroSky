name: Backend CI

# Lives at the repository root because GitHub only reads workflows from
# .github/workflows there; the backend itself sits in TroSky/backend.
on:
  push:
    branches: [main, develop, backend]
    paths: ["TroSky/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["TroSky/backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Environment to deploy (requires Environment approval rules)"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

# `run:` steps execute in the backend folder; `uses:` steps (checkout,
# setup-python, upload-artifact, Trivy) resolve paths from the repository
# root, hence the TroSky/backend/ prefix on theirs.
defaults:
  run:
    working-directory: TroSky/backend

jobs:
  lint-and-typecheck:
    name: Lint, format check, mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: TroSky/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app scripts

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: trosky
          POSTGRES_PASSWORD: trosky
          POSTGRES_DB: trosky_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trosky -d trosky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: TroSky/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The app's settings need the test secrets as well as the database
      # (Alembic and the seed load them too). .env.test holds placeholder
      # values pointing at this job's Postgres and Redis services.
      - name: Use the test settings for every step below
        run: grep -vE '^[[:space:]]*(#|$)' .env.test >> "$GITHUB_ENV"

      - name: Run Alembic migrations against ephemeral database (migration validation)
        env:
          DATABASE_URL: "******localhost:5432/trosky_test"
          DATABASE_URL_SYNC: "******localhost:5432/trosky_test"
        run: alembic upgrade head

      - name: Seed reference data (roles and permissions), as every deploy does
        run: python -m scripts.seed_reference_data

      - name: Run test suite with coverage
        env:
          DATABASE_URL: "******localhost:5432/trosky_test"
          DATABASE_URL_SYNC: "******localhost:5432/trosky_test"
          REDIS_URL: redis://localhost:6379/15
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: TroSky/backend/coverage.xml

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Scanners need exact versions, but pyproject.toml holds ranges. Install
      # the project the way it ships and pin whatever resolved, transitive
      # dependencies included.
      - name: Resolve runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip freeze --exclude-editable | grep -iv '^trosky-backend' > requirements.lock.txt
          echo "Pinned $(wc -l < requirements.lock.txt) packages"

      # Blocking gate: any HIGH or CRITICAL vulnerability that has a released
      # fix fails the job, and so the pull request. Trivy rather than
      # pip-audit because pip-audit cannot filter by severity. Unfixed
      # advisories are excluded because no upgrade could clear them; they
      # still appear in the image scan below. To accept a specific finding,
      # add its ID with a justification to a .trivyignore file at the
      # repository root -- a reviewed exception, never `|| true`.
      - name: Fail on High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: TroSky/backend/requirements.lock.txt
          scanners: vuln
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: table

  build-image:
    name: Build, publish & scan container image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, dependency-scan]
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image-meta.outputs.repository }}
      image_tag: ${{ steps.image-meta.outputs.tag }}
      image_ref: ${{ steps.image-meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase GHCR image name
        id: image-meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repository="ghcr.io/${owner}/trosky-backend"
          tag="${GITHUB_SHA}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${repository}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (trusted events only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push on trusted events)
        uses: docker/build-push-action@v6
        with:
          context: TroSky/backend
          file: TroSky/backend/Dockerfile
          target: runtime
          tags: ${{ steps.image-meta.outputs.image_ref }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.image-meta.outputs.image_ref }}
          severity: "CRITICAL,HIGH"
          exit-code: "0" # report only for MVP; tighten to "1" once the base image is hardened
          format: table

  # --- Deployment gates -----------------------------------------------
  # Each environment is a GitHub Environment with required reviewers
  # configured in repo settings. `production` in particular MUST have a
  # manual approval gate — this workflow never deploys to it automatically.
  deploy-development:
    name: Deploy to development
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'Numbu-bit/TroSky' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'development')
      )
    environment: development
    steps:
      - name: Trigger environment deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TIMEOUT_SECONDS: ${{ vars.DEPLOY_WEBHOOK_TIMEOUT_SECONDS || '30' }}
          DEPLOY_ENVIRONMENT: development
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Missing DEPLOY_WEBHOOK_URL secret for ${DEPLOY_ENVIRONMENT} environment."
            exit 1
          fi
          payload="$(jq -nc --arg environment "$DEPLOY_ENVIRONMENT" --arg image_ref "$IMAGE_REF" '{environment:$environment,image_ref:$image_ref}')"
          curl --fail --silent --show-error \
            --max-time "$DEPLOY_WEBHOOK_TIMEOUT_SECONDS" \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DEPLOY_WEBHOOK_URL"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'Numbu-bit/TroSky' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'staging')
      )
    environment: staging
    steps:
      - name: Trigger environment deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TIMEOUT_SECONDS: ${{ vars.DEPLOY_WEBHOOK_TIMEOUT_SECONDS || '30' }}
          DEPLOY_ENVIRONMENT: staging
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Missing DEPLOY_WEBHOOK_URL secret for ${DEPLOY_ENVIRONMENT} environment."
            exit 1
          fi
          payload="$(jq -nc --arg environment "$DEPLOY_ENVIRONMENT" --arg image_ref "$IMAGE_REF" '{environment:$environment,image_ref:$image_ref}')"
          curl --fail --silent --show-error \
            --max-time "$DEPLOY_WEBHOOK_TIMEOUT_SECONDS" \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DEPLOY_WEBHOOK_URL"

  deploy-production:
    name: Deploy to production (manual approval required)
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'Numbu-bit/TroSky' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'production')
      )
    environment: production # configure required reviewers on this Environment in GitHub settings
    steps:
      - name: Trigger environment deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TIMEOUT_SECONDS: ${{ vars.DEPLOY_WEBHOOK_TIMEOUT_SECONDS || '30' }}
          DEPLOY_ENVIRONMENT: production
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Missing DEPLOY_WEBHOOK_URL secret for ${DEPLOY_ENVIRONMENT} environment."
            exit 1
          fi
          payload="$(jq -nc --arg environment "$DEPLOY_ENVIRONMENT" --arg image_ref "$IMAGE_REF" '{environment:$environment,image_ref:$image_ref}')"
          curl --fail --silent --show-error \
            --max-time "$DEPLOY_WEBHOOK_TIMEOUT_SECONDS" \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DEPLOY_WEBHOOK_URL"
