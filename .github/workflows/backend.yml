name: Backend CI

# Lives at the repository root because GitHub only reads workflows from
# .github/workflows there; the backend itself sits in TroSky/backend.
on:
  push:
    branches: [main, develop, backend]
    paths: ["TroSky/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["TroSky/backend/**", ".github/workflows/backend.yml"]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: trosky-backend

# `run:` steps execute in the backend folder; `uses:` steps (checkout,
# setup-python, upload-artifact, Trivy) resolve paths from the repository
# root, hence the TroSky/backend/ prefix on theirs.
defaults:
  run:
    working-directory: TroSky/backend

jobs:
  lint-and-typecheck:
    name: Lint, format check, mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: TroSky/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app scripts

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: trosky
          POSTGRES_PASSWORD: trosky
          POSTGRES_DB: trosky_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trosky -d trosky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: TroSky/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The app's settings need the test secrets as well as the database
      # (Alembic and the seed load them too). .env.test holds placeholder
      # values pointing at this job's Postgres and Redis services.
      - name: Use the test settings for every step below
        run: grep -vE '^[[:space:]]*(#|$)' .env.test >> "$GITHUB_ENV"

      - name: Run Alembic migrations against ephemeral database (migration validation)
        env:
          DATABASE_URL: postgresql+asyncpg://trosky:trosky@localhost:5432/trosky_test
          DATABASE_URL_SYNC: postgresql+psycopg://trosky:trosky@localhost:5432/trosky_test
        run: alembic upgrade head

      - name: Seed reference data (roles and permissions), as every deploy does
        run: python -m scripts.seed_reference_data

      - name: Run test suite with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://trosky:trosky@localhost:5432/trosky_test
          DATABASE_URL_SYNC: postgresql+psycopg://trosky:trosky@localhost:5432/trosky_test
          REDIS_URL: redis://localhost:6379/15
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: TroSky/backend/coverage.xml

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Scanners need exact versions, but pyproject.toml holds ranges. Install
      # the project the way it ships and pin whatever resolved, transitive
      # dependencies included.
      - name: Resolve runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip freeze --exclude-editable | grep -iv '^trosky-backend' > requirements.lock.txt
          echo "Pinned $(wc -l < requirements.lock.txt) packages"

      # Blocking gate: any HIGH or CRITICAL vulnerability that has a released
      # fix fails the job, and so the pull request. Trivy rather than
      # pip-audit because pip-audit cannot filter by severity. Unfixed
      # advisories are excluded because no upgrade could clear them; they
      # still appear in the image scan below. To accept a specific finding,
      # add its ID with a justification to a .trivyignore file at the
      # repository root -- a reviewed exception, never `|| true`.
      # Pinned to a commit: after a supply chain attack in March 2026 Aqua
      # moved trivy-action to "v" tags, and "0.24.0" no longer resolves.
      - name: Fail on High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: TroSky/backend/requirements.lock.txt
          scanners: vuln
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: table

  build-image:
    name: Build & scan container image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} --target runtime .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "0" # report only for MVP; tighten to "1" once the base image is hardened
          format: table

      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: TroSky/backend/image.tar
          retention-days: 7

  # --- Deployment gates -----------------------------------------------
  # Each environment is a GitHub Environment with required reviewers
  # configured in repo settings. `production` in particular MUST have a
  # manual approval gate — this workflow never deploys to it automatically.
  deploy-development:
    name: Deploy to development
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Deploy (placeholder)
        # No checkout in these jobs, so TroSky/backend (the default above)
        # doesn't exist: run from the empty workspace instead.
        working-directory: .
        run: echo "Wire this step to your k8s/Helm deploy pipeline for the development cluster."

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy (placeholder)
        # No checkout in these jobs, so TroSky/backend (the default above)
        # doesn't exist: run from the empty workspace instead.
        working-directory: .
        run: echo "Wire this step to your k8s/Helm deploy pipeline for the staging cluster."

  deploy-production:
    name: Deploy to production (manual approval required)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production # configure required reviewers on this Environment in GitHub settings
    steps:
      - name: Deploy (placeholder)
        # No checkout in these jobs, so TroSky/backend (the default above)
        # doesn't exist: run from the empty workspace instead.
        working-directory: .
        run: echo "Wire this step to your k8s/Helm deploy pipeline for the production cluster."
